name: build

on:
  push:
    branches:
      - dev
    paths:
      - "variants/**"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: variants/latest
            tag: latest
          - context: variants/rapid
            tag: rapid

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: docker::login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker::build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/planyear/action-runner:${{ matrix.tag }}
